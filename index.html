<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Seed 마켓</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="product.js"></script>
<script type="module" src="product-list.js"></script>
<script type="module" src="chat.js"></script>
</head>
<body>

<h1>Seed 마켓</h1>
<p>동아리 'Seed' 회원 전용 직거래 마켓</p>

<section>
  <h2>회원가입 / 로그인</h2>
  <input id="email" placeholder="이메일">
  <input id="password" type="password" placeholder="비밀번호">
  <button onclick="signUp(email.value, password.value)">회원가입</button>
  <button onclick="login(email.value, password.value)">로그인</button>
</section>

<section>
  <h2>상품 등록</h2>
  <input id="title" placeholder="상품명">
  <input id="price" placeholder="가격">
  <input id="description" placeholder="설명">
  <input id="file" type="file">
  <button onclick="addProduct(title.value, price.value, description.value, file.files[0])">등록</button>
</section>

<section>
  <h2>상품 목록</h2>
  <div id="product-list"></div>
  <button onclick="showProducts()">목록 새로고침</button>
</section>

<section>
  <h2>채팅</h2>
  <input id="productId" placeholder="상품 ID">
  <input id="message" placeholder="메시지">
  <button onclick="sendMessage(productId.value, message.value)">전송</button>
  <button onclick="showChat(productId.value)">채팅보기</button>
  <div id="chat-list"></div>
</section>

</body>
</html>
