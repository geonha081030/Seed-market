<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Market</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 로그인 -->
  <div id="login-screen">
    <h2>로그인</h2>
    <input id="login-email" placeholder="이메일">
    <input id="login-password" type="password" placeholder="비밀번호">
    <button id="login-btn">로그인</button>
    <button id="show-signup-btn">회원가입</button>
  </div>

  <!-- 회원가입 -->
  <div id="signup-screen" style="display:none;">
    <h2>회원가입</h2>
    <input id="signup-email" placeholder="이메일">
    <input id="signup-password" type="password" placeholder="비밀번호">
    <button id="signup-btn">회원가입</button>
    <button id="back-to-login-btn">로그인 화면으로</button>
  </div>

  <!-- 메인 -->
  <div id="main-screen" style="display:none;">
    <h2>Seed Market</h2>
    <button id="logout-btn">로그아웃</button>
    <button id="go-add-btn">상품 등록</button>
    <button id="go-list-btn">상품 목록</button>
    <button id="go-mypage-btn">마이페이지</button>
  </div>

  <!-- 상품 등록 -->
  <div id="product-add-screen" style="display:none;">
    <h3>상품 등록</h3>
    <input id="product-title" placeholder="상품명">
    <input id="product-price" type="number" placeholder="가격">
    <textarea id="product-desc" placeholder="상세 설명"></textarea>
    <button id="add-product-btn">등록</button>
    <button id="back-main-btn">메인으로</button>
  </div>

  <!-- 상품 목록 -->
  <div id="product-list-screen" style="display:none;">
    <h3>상품 목록</h3>
    <input id="product-search" placeholder="상품명 검색">
    <div id="product-list"></div>
    <button id="back-main-from-list-btn">메인으로</button>
  </div>

  <!-- 상품 상세 -->
  <div id="product-detail-screen" style="display:none;">
    <h3 id="detail-title"></h3>
    <p id="detail-price"></p>
    <p id="detail-desc"></p>
    <div id="detail-chat-area"></div>
    <button id="back-main-from-detail-btn">메인으로</button>
  </div>

  <!-- 마이페이지 -->
  <div id="mypage-screen" style="display:none;">
    <h3>마이페이지</h3>
    <p id="my-email"></p>
    <button id="go-chat-list-btn">내 채팅 목록 보기</button>
    <h4>내 상품 관리</h4>
    <div id="my-products"></div>
    <button id="back-main-from-mypage-btn">메인으로</button>
  </div>

  <!-- 채팅 목록 -->
  <div id="chat-list-screen" style="display:none;">
    <h3>내 채팅 목록</h3>
    <div id="chat-rooms-container"></div>
    <button id="back-mypage-from-chatlist-btn">마이페이지로</button>
  </div>

  <!-- 채팅 -->
  <div id="chat-screen" style="display:none;">
    <h3 id="chat-title">채팅</h3>
    <div id="chat-messages" style="height: 350px; overflow-y: auto; background: #f4f4f4; border: 1px solid #ddd; margin: 10px; padding: 10px;"></div>
    <div style="display: flex; gap: 5px; padding: 10px;">
      <input id="chat-input" placeholder="메시지 입력" style="flex: 1;">
      <button id="send-chat-btn">전송</button>
    </div>
    <button id="back-from-chat-btn">뒤로가기</button>
  </div>

  <!-- 🔥 스크립트 (순서 중요, defer 없음) -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="product.js"></script>
  <script type="module" src="product-list.js"></script>
  <script type="module" src="product-detail.js"></script>
  <script type="module" src="chat.js"></script>
  <script type="module" src="mypage.js"></script>

</body>
</html>
