<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Seed Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 로그인/회원가입 화면 -->
<div id="auth">
  <h2>회원가입 / 로그인</h2>
  <input type="email" id="email" placeholder="이메일">
  <input type="password" id="password" placeholder="비밀번호">
  <button onclick="signUp()">회원가입</button>
  <button onclick="login()">로그인</button>
</div>

<!-- 메인 앱 화면 -->
<div id="app" style="display:none;">
  <button onclick="logout()">로그아웃</button>
  <h2>상품 등록 / 목록</h2>

  <button onclick="showSection('registerSection')">상품 등록</button>
  <button onclick="showSection('listSection')">상품 목록</button>

  <!-- 상품 등록 -->
  <div id="registerSection" style="display:none;">
    <input type="text" id="title" placeholder="상품명">
    <input type="number" id="price" placeholder="가격">
    <button onclick="addItem()">등록</button>
  </div>

  <!-- 상품 등록 완료 팝업 -->
  <div id="successPopup" style="display:none;">
    상품이 등록되었습니다!
    <button onclick="closePopup()">확인</button>
  </div>

  <!-- 상품 목록 -->
  <div id="listSection" style="display:none;">
    <input type="text" id="searchInput" placeholder="검색">
    <button onclick="searchItems()">검색</button>
    <div id="items"></div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
