<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Seed Market</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 로그인 -->
  <div id="login-screen">
    <h2>로그인</h2>
    <input id="login-email" placeholder="이메일">
    <input id="login-password" type="password" placeholder="비밀번호">
    <button id="login-btn">로그인</button>
    <button onclick="showSignupScreen()">회원가입</button>
  </div>

  <!-- 회원가입 -->
  <div id="signup-screen" style="display:none;">
    <h2>회원가입</h2>
    <input id="signup-email" placeholder="이메일">
    <input id="signup-password" type="password" placeholder="비밀번호">
    <button id="signup-btn">회원가입</button>
    <button onclick="showLoginScreen()">로그인 화면으로</button>
  </div>

  <!-- 메인 -->
  <div id="main-screen" style="display:none;">
    <h2>Seed Market</h2>
    <button id="logout-btn">로그아웃</button>
    <button onclick="showAddProductScreen()">상품 등록</button>
    <button onclick="showProductListScreen()">상품 목록</button>
    <button onclick="showMyPage()">마이페이지</button>
  </div>

  <!-- 상품 목록 -->
  <div id="product-list-screen" style="display:none;">
    <h3>상품 목록</h3>
    <div id="product-list"></div>
    <button onclick="showMainScreen()">메인으로</button>
  </div>

  <!-- 상품 등록 -->
  <div id="product-add-screen" style="display:none;">
    <h3>상품 등록</h3>
    <input id="product-title" placeholder="상품명">
    <input id="product-price" type="number" placeholder="가격">
    <textarea id="product-desc" placeholder="설명"></textarea>
    <button id="add-product-btn">등록</button>
    <button onclick="showMainScreen()">메인으로</button>
  </div>

  <!-- 상세 + 채팅 -->
  <div id="product-detail-screen" style="display:none;">
    <h3 id="detail-title"></h3>
    <p id="detail-price"></p>
    <p id="detail-desc"></p>

    <h4>채팅</h4>
    <div id="chat-list" style="height:200px; overflow:auto; border:1px solid #ccc;"></div>

    <input id="chat-input" placeholder="메시지 입력">
    <button onclick="sendMessage()">전송</button>

    <button onclick="showMainScreen()">메인으로</button>
  </div>

  <!-- JS -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="product.js"></script>
  <script type="module" src="product-list.js"></script>
  <script type="module" src="product-detail.js"></script>
  <script type="module" src="mypage.js"></script>

</body>
</html>
