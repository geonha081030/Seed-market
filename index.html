<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Market</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen">
    <h2>로그인</h2>
    <input id="login-email" placeholder="이메일">
    <input id="login-password" type="password" placeholder="비밀번호">
    <button id="login-btn">로그인</button>
    <button id="show-signup-btn">회원가입</button>
  </div>

  <div id="signup-screen" style="display:none;">
    <h2>회원가입</h2>
    <input id="signup-email" placeholder="이메일">
    <input id="signup-password" type="password" placeholder="비밀번호">
    <button id="signup-btn">가입하기</button>
    <button id="back-to-login-btn">뒤로가기</button>
  </div>

  <div id="main-screen" style="display:none;">
    <h2>Seed Market</h2>
    <button id="go-list-btn">상품 구경하기</button>
    <button id="go-add-btn">내 물건 팔기</button>
    <button id="go-mypage-btn">마이페이지</button>
    <button id="logout-btn">로그아웃</button>
  </div>

  <div id="product-add-screen" style="display:none;">
    <h3>상품 등록</h3>
    <input id="product-title" placeholder="상품명">
    <input id="product-price" type="number" placeholder="가격">
    <textarea id="product-desc" placeholder="상세 설명"></textarea>
    <button id="add-product-btn">등록하기</button>
    <button id="back-main-btn">취소</button>
  </div>

  <div id="product-list-screen" style="display:none;">
    <h3>상품 목록</h3>
    <input id="product-search" placeholder="상품명 검색...">
    <div id="product-list"></div>
    <button id="back-main-from-list-btn">홈으로</button>
  </div>

  <div id="product-detail-screen" style="display:none;">
    <h3 id="detail-title"></h3>
    <p id="detail-price" style="font-weight:bold; color:#4CAF50;"></p>
    <div id="detail-desc" style="padding:10px; text-align:left;"></div>
    <div id="detail-chat-area"></div>
    <button id="back-list-from-detail-btn">목록으로</button>
  </div>

  <div id="mypage-screen" style="display:none;">
    <h3>마이페이지</h3>
    <p id="my-email" style="color:#888;"></p>
    <button id="go-chat-list-btn">내 채팅 목록</button>
    <hr>
    <h4>내가 올린 상품</h4>
    <div id="my-products"></div>
    <button id="back-main-from-mypage-btn">홈으로</button>
  </div>

  <div id="chat-list-screen" style="display:none;">
    <h3>채팅 목록</h3>
    <div id="chat-rooms-container"></div>
    <button id="back-mypage-from-chatlist-btn">뒤로가기</button>
  </div>

  <div id="chat-screen" style="display:none;">
    <h3 id="chat-title">대화</h3>
    <div id="chat-messages"></div>
    <div class="chat-input-container">
      <input id="chat-input" placeholder="메시지 입력">
      <button id="send-chat-btn">전송</button>
    </div>
    <button id="back-from-chat-btn">나가기</button>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="chat.js"></script>
  <script type="module" src="product.js"></script>
  <script type="module" src="product-list.js"></script>
  <script type="module" src="product-detail.js"></script>
  <script type="module" src="mypage.js"></script>
</body>
</html>
