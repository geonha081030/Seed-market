<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Seed Market</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 간단한 기본 스타일 */
    body { font-family: Arial, sans-serif; margin: 20px; }
    input, textarea, button { margin: 5px 0; padding: 5px; }
    #product-list div.product-card { border: 1px solid #ccc; padding: 5px; margin-bottom:5px; cursor: pointer; }
    #product-list div.product-card.sold { background-color: #f0f0f0; opacity: 0.7; }
  </style>
</head>
<body>
  <!-- 로그인 화면 -->
  <div id="login-screen">
    <h2>로그인</h2>
    <input id="login-email" placeholder="이메일">
    <input id="login-password" type="password" placeholder="비밀번호">
    <button id="login-btn">로그인</button>
    <p>계정이 없나요? <button id="show-signup-btn">회원가입</button></p>
  </div>

  <!-- 회원가입 화면 -->
  <div id="signup-screen" style="display:none;">
    <h2>회원가입</h2>
    <input id="signup-email" placeholder="이메일">
    <input id="signup-password" type="password" placeholder="비밀번호">
    <button id="signup-btn">회원가입</button>
    <button id="back-to-login-btn">로그인 화면으로</button>
  </div>

  <!-- 메인 화면 -->
  <div id="main-screen" style="display:none;">
    <h2>Seed Market</h2>
    <button id="logout-btn">로그아웃</button>
    <button id="go-add-btn">상품 등록</button>
    <button id="go-list-btn">상품 목록</button>
  </div>

  <!-- 상품 등록 화면 -->
  <div id="product-add-screen" style="display:none;">
    <h3>상품 등록</h3>
    <input id="product-title" placeholder="상품명">
    <input id="product-price" type="number" placeholder="가격">
    <textarea id="product-desc" placeholder="상세 설명"></textarea>
    <button id="add-product-btn">등록</button>
    <button id="back-main-btn">메인 화면으로</button>
  </div>

  <!-- 상품 목록 화면 -->
  <div id="product-list-screen" style="display:none;">
    <h3>상품 목록</h3>
    <input id="product-search" placeholder="검색">
    <div id="product-list"></div>
    <button id="back-main-from-list-btn">메인 화면으로</button>
  </div>

  <!-- 상품 상세 & 채팅 화면 -->
  <div id="product-detail-screen" style="display:none; padding: 10px;">
    <h3 id="detail-title">상품명</h3>
    <p id="detail-price">가격</p>
    <p id="detail-desc">상세 설명</p>
    <p id="detail-sold">판매 여부</p>
    <button id="detail-sold-btn" style="display:none;">판매 완료</button>

    <hr>

    <h4>채팅</h4>
    <div id="chat-list" style="height:200px; overflow-y:auto; border:1px solid #ccc; padding:5px; margin-bottom:5px;"></div>
    <input id="chat-input" type="text" placeholder="메시지 입력" style="width:70%;">
    <button id="chat-send-btn">전송</button>

    <hr>

    <button id="back-main-from-detail-btn">메인 화면으로</button>
  </div>

  <!-- Firebase 및 JS 모듈 -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="product.js"></script>
  <script type="module" src="product-list.js"></script>
  <script type="module" src="product-detail.js"></script>
</body>
</html>
